name: Build and Test

# Builds the solution, runs the test suite and does a trial publish on every
# push and pull request, so a broken build or test is caught before release.

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "beta", "release" ]
  pull_request:
    branches: [ "main", "master", "beta", "release" ]

jobs:
  test-build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # FFmpeg DLLs and yt-dlp.exe are stored in Git LFS; the player tests need them.
        lfs: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore EdgeLoop.sln

    - name: Build solution
      run: dotnet build EdgeLoop.sln -c Release --no-restore

    - name: Run tests
      run: dotnet test EdgeLoop.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: TestResults
        if-no-files-found: ignore

    - name: Test Publish
      run: |
        dotnet publish EdgeLoop\EdgeLoop.csproj `
          -c Release `
          -r win-x64 `
          --self-contained false `
          -p:PublishSingleFile=false `
          -o publish-test

    - name: Verify executable exists
      run: |
        $exePath = Get-Item "publish-test/EdgeLoop.exe" -ErrorAction SilentlyContinue
        if (-not $exePath) {
          Write-Error "EdgeLoop.exe not found in publish-test directory"
          exit 1
        }
        Write-Host "Executable found: $($exePath.Name) ($($exePath.Length) bytes)"
      shell: pwsh
